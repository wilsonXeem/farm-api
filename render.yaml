services:
  - type: web
    name: pffms-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && node --max-old-space-size=512 node_modules/.bin/nest build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
